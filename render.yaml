services:
  - type: web
    name: shamir-vault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --ws-max-size 4096
    healthCheckPath: /api/health
    envVars:
      - key: TRUST_PROXY
        value: "1"
